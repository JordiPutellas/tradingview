<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BTC · jputellas.dev</title>
<style>
  :root { --bg:#363636; --panel:#2e2e2e; --border:#4a4a4a; --fg:#dadada; --muted:#9a9a9a;
          --accent:#7092be; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.4 system-ui, sans-serif;
         display:flex; flex-direction:column; height:100vh; overflow:hidden; }
  /* Cabecera de UNA sola línea siempre: la barra de timeframes se desplaza
     lateralmente (rueda o arrastre) en vez de partirse en dos filas. */
  header { display:flex; align-items:center; gap:8px; padding:6px 10px; background:var(--panel);
           border-bottom:1px solid var(--border); flex-wrap:nowrap; overflow:hidden; }
  header .brand { font-weight:700; color:var(--accent); flex:none; }
  .tfs { display:flex; gap:2px; flex:1 1 auto; min-width:0; overflow-x:auto; cursor:grab;
         scrollbar-width:none; overscroll-behavior-x:contain; }
  .tfs::-webkit-scrollbar { display:none; }
  .tfs.dragging { cursor:grabbing; }
  .tfs button, .tools button {
    background:transparent; color:var(--fg); border:1px solid transparent; border-radius:4px;
    padding:3px 7px; cursor:pointer; font:inherit; flex:none; white-space:nowrap; }
  .tfs button:hover, .tools button:hover { background:#404040; }
  .tfs button.active { color:var(--accent); border-color:var(--border); background:#404040; }
  #status { font-size:11px; color:var(--muted); flex:none; margin-left:4px; }
  #chart { flex:1; min-height:0; }
  /* Barra de dibujo flotante y arrastrable (posición persistida). Puede
     superponerse a la cabecera: z-index por encima. */
  .tools { position:fixed; left:8px; top:44px; z-index:30; display:flex; align-items:center; gap:2px;
           background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:3px 4px;
           box-shadow:0 6px 18px rgba(0,0,0,.45); }
  .tools button.active { color:var(--accent); background:#404040; border-color:var(--border); }
  .grip { cursor:grab; color:var(--muted); padding:0 5px; user-select:none; touch-action:none;
          letter-spacing:-2px; }
  .tools.dragging .grip { cursor:grabbing; }
  /* Panel de configuración del dibujo seleccionado (F3) */
  #drawPanel { position:fixed; z-index:40; background:var(--panel); border:1px solid var(--border);
               border-radius:6px; padding:6px 8px; box-shadow:0 6px 18px rgba(0,0,0,.5);
               display:flex; flex-direction:column; gap:5px; font-size:12px; min-width:210px; }
  #drawPanel[hidden] { display:none; }
  #drawPanel .row { display:flex; align-items:center; gap:6px; }
  #drawPanel .row[hidden] { display:none; }
  #drawPanel label { color:var(--muted); display:flex; align-items:center; gap:4px; flex:1; }
  #drawPanel input[type=color] { width:26px; height:22px; padding:0; border:1px solid var(--border);
                                 background:none; border-radius:4px; cursor:pointer; }
  #drawPanel input[type=range] { flex:1; min-width:70px; accent-color:var(--accent); }
  #drawPanel input[type=text] { flex:1; background:#3a3a3a; color:var(--fg); border:1px solid var(--border);
                                border-radius:4px; padding:2px 5px; font:inherit; }
  #drawPanel select { background:#3a3a3a; color:var(--fg); border:1px solid var(--border);
                      border-radius:4px; padding:2px 4px; font:inherit; }
  #drawPanel button { background:transparent; color:var(--fg); border:1px solid transparent;
                      border-radius:4px; padding:2px 6px; cursor:pointer; font:inherit; }
  #drawPanel button:hover { background:#404040; }
  #drawPanel button.active { color:var(--accent); border-color:var(--border); background:#404040; }
  #drawPanel select[data-k="tpl"] { flex:1; min-width:0; }
</style>
</head>
<body>
<header>
  <span class="brand">BTCUSDT·P</span>
  <div class="tfs" id="tfs"></div>
  <span id="status">conectando…</span>
</header>
<div id="chart"></div>
<div class="tools" id="tools">
  <span class="grip" id="toolsGrip" title="Arrastra para mover la barra">⣿</span>
  <button data-tool="hline" title="Línea horizontal (extendida)">─</button>
  <button data-tool="hray" title="Línea horizontal (desde el punto)">╶─</button>
  <button data-tool="trend" title="Línea de tendencia">╱</button>
  <button data-tool="rect" title="Rectángulo / zona">▭</button>
  <button data-tool="curve" title="Curva">◠</button>
  <button data-tool="arc" title="Arco">◡</button>
  <button data-tool="point" title="Punto">●</button>
  <button data-tool="text" title="Texto">T</button>
  <button data-tool="zone2" title="Zona de dos niveles">≡</button>
  <button data-tool="__measure" title="Medir (o Shift + click en el gráfico)">📏</button>
  <button data-tool="__clear" title="Borrar selección (Supr)">🗑</button>
</div>
<div id="drawPanel" hidden>
  <div class="row">
    <input type="color" data-k="color" title="Color de línea">
    <select data-k="width" title="Grosor">
      <option value="1">1 px</option><option value="2">2 px</option>
      <option value="3">3 px</option><option value="4">4 px</option>
    </select>
    <select data-k="dash" title="Estilo">
      <option value="0">Sólida</option><option value="1">Discontinua</option>
    </select>
    <button data-act="del" title="Borrar (Supr)">🗑</button>
  </div>
  <div class="row"><label>Opacidad<input type="range" data-k="opacity" min="0.1" max="1" step="0.05"></label></div>
  <div class="row row-fill">
    <input type="color" data-k="fill" title="Color de relleno">
    <label>Relleno<input type="range" data-k="fillOpacity" min="0" max="1" step="0.05"></label>
  </div>
  <div class="row row-text"><input type="text" data-k="text" placeholder="Texto"></div>
  <div class="row row-zone"><span style="color:var(--muted)">Línea</span>
    <button data-line="0">A</button><button data-line="1">B</button></div>
  <div class="row row-tpl">
    <select data-k="tpl" title="Aplicar una plantilla de estilo"><option value="">— plantilla —</option></select>
    <button data-act="tpl-save" title="Guardar el estilo actual como plantilla">＋</button>
    <button data-act="tpl-def" title="Marcar la plantilla como predeterminada">★</button>
    <button data-act="tpl-del" title="Borrar la plantilla">✕</button>
  </div>
  <div class="row row-tpl-name" hidden>
    <input type="text" data-k="tplName" placeholder="Nombre de la plantilla" maxlength="40">
    <button data-act="tpl-ok">Guardar</button>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
