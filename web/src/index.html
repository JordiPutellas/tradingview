<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BTC · jputellas.dev</title>
<style>
  :root { --bg:#0e1117; --panel:#161b22; --border:#30363d; --fg:#c9d1d9; --accent:#f0b90b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.4 system-ui, sans-serif;
         display:flex; flex-direction:column; height:100vh; overflow:hidden; }
  header { display:flex; align-items:center; gap:8px; padding:6px 10px; background:var(--panel);
           border-bottom:1px solid var(--border); flex-wrap:wrap; }
  header .brand { font-weight:700; color:var(--accent); margin-right:6px; }
  .tfs { display:flex; gap:2px; flex-wrap:wrap; }
  .tfs button, .tools button {
    background:transparent; color:var(--fg); border:1px solid transparent; border-radius:4px;
    padding:3px 7px; cursor:pointer; font:inherit; }
  .tfs button:hover, .tools button:hover { background:#21262d; }
  .tfs button.active { color:var(--accent); border-color:var(--border); background:#21262d; }
  .tools { display:flex; gap:2px; margin-left:auto; }
  .tools button.active { color:var(--accent); background:#21262d; border-color:var(--border); }
  #status { font-size:11px; color:#8b949e; margin-left:8px; }
  #chart { flex:1; min-height:0; }
</style>
</head>
<body>
<header>
  <span class="brand">BTCUSDT·P</span>
  <div class="tfs" id="tfs"></div>
  <div class="tools" id="tools">
    <button data-tool="hline" title="Línea horizontal (extendida)">─</button>
    <button data-tool="hray" title="Línea horizontal (desde el punto)">╶─</button>
    <button data-tool="trend" title="Línea de tendencia">╱</button>
    <button data-tool="rect" title="Rectángulo / zona">▭</button>
    <button data-tool="curve" title="Curva">◠</button>
    <button data-tool="arc" title="Arco">◡</button>
    <button data-tool="point" title="Punto">●</button>
    <button data-tool="text" title="Texto">T</button>
    <button data-tool="zone2" title="Zona de dos niveles">≡</button>
    <button data-tool="__clear" title="Borrar selección (Supr)">🗑</button>
  </div>
  <span id="status">conectando…</span>
</header>
<div id="chart"></div>
<script src="app.js"></script>
</body>
</html>
