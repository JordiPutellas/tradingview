# Despliegue en jordios (Hetzner CX23, 4 GB, compartido con Hermes).
# Reglas del servidor:
#   - TODO puerto con bind explícito a 127.0.0.1: Docker manipula iptables y
#     se salta UFW; un "5433:5432" sin bind quedaría expuesto a internet.
#   - 5432 está ocupado por jordios-postgres (Hermes): TimescaleDB va en 5433.
#   - 8080 está ocupado por el placeholder de cloudflared: health en 8081.
#   - mem_limit obligatorio: un OOM se llevaría por delante el agente de Hermes.
services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    mem_limit: 768m
    environment:
      POSTGRES_USER: btc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-btc}
      POSTGRES_DB: btc
      TS_TUNE_MEMORY: 512MB
      TS_TUNE_NUM_CPUS: "2"
    # shared_buffers conservador: prioriza no molestar a Hermes sobre el
    # rendimiento de lectura (la API llega en F1c; ya se ajustará con datos).
    command: >-
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=384MB
      -c maintenance_work_mem=64MB
      -c max_connections=50
    volumes:
      - tsdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U btc -d btc"]
      interval: 5s
      timeout: 3s
      retries: 12

  collector:
    build: .
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://btc:${POSTGRES_PASSWORD:-btc}@timescaledb:5432/btc
      SYMBOL: BTCUSDT
      RECONCILE_WINDOW: 40h
      HEALTH_ADDR: ":8080"
      # La config específica del servidor va SIEMPRE en .env (gitignorado),
      # NUNCA editando este fichero: el rsync de deploy lo pisa (pasó con la
      # monitorización durante F1b — fallo silencioso del propio avisador).
      HEALTHCHECK_URL: ${HEALTHCHECK_URL:-}
    ports:
      - "127.0.0.1:8081:8080"

  # API + frontend (F1c). El túnel de cloudflared ya apunta a 127.0.0.1:8080
  # (con IP explícita); la API ocupa ese puerto y no hay que tocar el túnel.
  api:
    build: .
    entrypoint: ["api"]
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://btc:${POSTGRES_PASSWORD:-btc}@timescaledb:5432/btc
      SYMBOL: BTCUSDT
      API_ADDR: ":8080"
      STATIC_DIR: /srv/static
    volumes:
      - ./webdist:/srv/static:ro
    ports:
      - "127.0.0.1:8080:8080"

  # Motor de alertas de precio (F5, bloque 3). Proceso APARTE del colector a
  # propósito: hablar con Telegram no puede compartir bucle con la ingesta.
  # Solo lee candles_1s; si se cae, la ingesta ni se entera.
  alerts:
    build: .
    entrypoint: ["alerts"]
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://btc:${POSTGRES_PASSWORD:-btc}@timescaledb:5432/btc
      SYMBOL: BTCUSDT
      # Sin estas dos, las alertas se evalúan y se registran pero NO se
      # notifican (el proceso lo avisa al arrancar). Van en .env, nunca aquí.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ALERT_REPLAY_MAX: ${ALERT_REPLAY_MAX:-2h}

  # ---------------------------------------------------------------- BACKUP
  # Copia por capas (F5, bloque 2). No arranca sola: la llama el cron con
  #   docker compose --profile ops run --rm backup -capas estado
  # El directorio ./backups está EXCLUIDO del rsync de deploy.sh: un despliegue
  # no puede llevarse por delante las copias.
  backup:
    profiles: ["ops"]
    build: .
    entrypoint: ["collector", "backup"]
    # Escribe en ./backups del HOST: tiene que hacerlo con el uid del usuario
    # del servidor, no con el 10001 de la imagen, o el bind mount le da
    # "permission denied" y no hay copia.
    user: "1000:1000"
    mem_limit: 256m
    environment:
      DATABASE_URL: postgres://btc:${POSTGRES_PASSWORD:-btc}@timescaledb:5432/btc
      SYMBOL: BTCUSDT
      # Destino fuera del servidor. Sin estas cuatro, la copia se queda en el
      # mismo disco que la base de datos y el comando lo avisa (ver RUNBOOK).
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-btcdash}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-auto}
      BACKUP_HEALTHCHECK_URL: ${BACKUP_HEALTHCHECK_URL:-}
    volumes:
      - ./backups:/backups

  # Restauración de prueba: una base de datos aparte donde volcar la copia y
  # comprobar que sirve.  docker compose --profile ops up -d timescaledb-restore
  timescaledb-restore:
    profiles: ["ops"]
    image: timescale/timescaledb:2.17.2-pg16
    restart: "no"
    mem_limit: 256m
    environment:
      POSTGRES_USER: btc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-btc}
      POSTGRES_DB: btc_restore_test
      TS_TUNE_MEMORY: 160MB
      TS_TUNE_NUM_CPUS: "1"
    volumes:
      - tsrestore:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U btc -d btc_restore_test"]
      interval: 5s
      timeout: 3s
      retries: 12

  # El mismo binario apuntando a la base de datos de restauración: migra y
  # mete la copia.  docker compose --profile ops run --rm restore -dir /backups/estado/<sello>
  restore:
    profiles: ["ops"]
    build: .
    entrypoint: ["collector", "restore"]
    mem_limit: 256m
    depends_on:
      timescaledb-restore:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://btc:${POSTGRES_PASSWORD:-btc}@timescaledb-restore:5432/btc_restore_test
      SYMBOL: BTCUSDT
    volumes:
      - ./backups:/backups:ro

  # ---------------------------------------------------------------- TEST
  # Entorno de test (F5, bloque 1). NO arranca solo: hay que pedirlo con
  #   docker compose --profile test up -d timescaledb-test
  # Existe porque hasta F4 las suites de frontend corrían contra la base de
  # datos de producción y llegaron a borrar los dibujos del usuario. Instancia
  # aparte, volumen aparte, puerto aparte: nada que puedan tocar por error.
  timescaledb-test:
    profiles: ["test"]
    image: timescale/timescaledb:2.17.2-pg16
    restart: "no"          # se enciende a mano y se apaga al terminar
    mem_limit: 256m
    environment:
      POSTGRES_USER: btc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-btc}
      POSTGRES_DB: btc_test
      TS_TUNE_MEMORY: 160MB
      TS_TUNE_NUM_CPUS: "1"
    command: >-
      postgres
      -c shared_buffers=48MB
      -c effective_cache_size=128MB
      -c maintenance_work_mem=32MB
      -c max_connections=20
    volumes:
      - tstest:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U btc -d btc_test"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Semilla: histórico sintético reproducible. La URL de test va aquí dentro
  # a propósito, para que no haya forma de apuntarla a producción desde la
  # línea de órdenes.  docker compose --profile test run --rm seed-test -days 400
  seed-test:
    profiles: ["test"]
    build: .
    entrypoint: ["collector", "seed-test"]
    mem_limit: 256m
    depends_on:
      timescaledb-test:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://btc:${POSTGRES_PASSWORD:-btc}@timescaledb-test:5432/btc_test
      SYMBOL: BTCUSDT

  # Feeder: una vela de 1s por segundo con su NOTIFY, para que el test de
  # streaming tenga algo que ver moverse.
  feeder-test:
    profiles: ["test"]
    build: .
    entrypoint: ["collector", "seed-test", "-live"]
    restart: "no"
    mem_limit: 128m
    depends_on:
      timescaledb-test:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://btc:${POSTGRES_PASSWORD:-btc}@timescaledb-test:5432/btc_test
      SYMBOL: BTCUSDT

volumes:
  tsdata:
  tstest:
  tsrestore:
