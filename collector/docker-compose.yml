services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: btc
      POSTGRES_PASSWORD: btc
      POSTGRES_DB: btc
    volumes:
      - tsdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" # solo para inspección local con psql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U btc -d btc"]
      interval: 5s
      timeout: 3s
      retries: 12

  collector:
    build: .
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://btc:btc@timescaledb:5432/btc
      SYMBOL: BTCUSDT
      RECONCILE_WINDOW: 40h
      HEALTH_ADDR: ":8080"
      # HEALTHCHECK_URL: https://hc-ping.com/<uuid>   # activar en producción
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  tsdata:
